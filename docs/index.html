<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GANG REIMBURSE — ギャング補填管理</title>
<link rel="stylesheet" href="./styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="site-header">
<div class="inner">
<div class="header-row">
<div>
<span class="tech-tag">FIVEM / GANG OPERATIONS</span>
<h1 class="tech-title">GANG REIMBURSE</h1>
<div class="tech-subtitle">ギャング補填管理</div>
<p class="tech-desc">犯罪枠を立て、参加・被害申告を集め、プール金から全額補填するまでの作戦ボード。現場はログイン不要、補填操作のみボス権限。</p>
</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
<span id="poolBadge" class="pool-chip"></span>
<button id="loginBtn" class="btn-boss">BOSS LOGIN</button>
</div>
</div>
<nav class="tech-nav">
<a href="#/dashboard" data-nav="dashboard">01 Dashboard</a>
<a href="#/jobs" data-nav="jobs">02 Operations</a>
<a href="#/pool" data-nav="pool">03 Pool</a>
<a href="#/members" data-nav="members">04 Members</a>
</nav>
<div id="modeBadge" class="mode-line"></div>
</div>
</header>
<main id="app"></main>
<div id="loginModal" class="modal-bg hidden">
<div class="modal-box tech-form">
<span class="panel-label">Boss Auth</span>
<h2 style="margin-top:8px;">ボス / アンダーボス ログイン</h2>
<p class="sub" style="font-size:13px;color:var(--tech-gray);">一般参加はログイン不要。補填完了・プール入出金・ダッシュボードのみ必要。</p>
<input id="loginPass" type="password" placeholder="合言葉" />
<div style="display:flex;gap:8px;margin-top:12px;">
<button id="loginGo" class="btn-primary" style="width:auto;flex:1;">ログイン</button>
<button id="loginClose" class="btn-ghost" style="flex:1;">閉じる</button>
</div>
<button id="logoutBtn" style="background:none;border:none;text-decoration:underline;font-size:12px;color:var(--tech-gray);margin-top:8px;cursor:pointer;">ログアウト</button>
</div>
</div>
<script src="./supabaseClient.js"></script>
<script src="./app.js"></script>
</body>
</html>
