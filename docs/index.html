<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GANG REIMBURSE — 補填管理システム</title>
<link rel="stylesheet" href="./styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="site-header">
<div class="inner">
<div class="header-row">
<div>
<span class="tech-tag">GANG OPERATIONS</span>
<h1 class="tech-title">GANG REIMBURSE</h1>
<div class="tech-subtitle">補填管理システム</div>
</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
<span id="poolBadge" class="pool-chip"></span>
<button id="loginBtn" class="btn-boss">LOGIN</button>
</div>
</div>
<nav class="tech-nav">
<a href="#/dashboard" data-nav="dashboard">01 Dashboard</a>
<a href="#/jobs" data-nav="jobs">02 Operations</a>
<a href="#/pool" data-nav="pool">03 Pool</a>
<a href="#/members" data-nav="members">04 Members</a>
</nav>
<div id="modeBadge" class="mode-line"></div>
</div>
</header>
<main id="app"></main>
<div id="loginModal" class="modal-bg hidden">
<div class="modal-box tech-form">
<span class="panel-label">Login</span>
<h2 style="margin-top:8px;">ログイン</h2>
<form onsubmit="loginUser(event)">
<div class="field"><label>名前</label><select id="loginUserSel" name="username"></select></div>
<div class="field" style="margin-top:8px;"><label>パスワード</label><input name="password" type="text" autocomplete="off" placeholder="パスワード" /></div>
<div style="margin-top:12px;"><button class="btn-primary" style="width:100%;">ログイン</button></div>
</form>
<details style="margin-top:12px;">
<summary style="font-size:12px;cursor:pointer;color:var(--tech-gray);">新規作成（初めての方）</summary>
<form onsubmit="signupUser(event)" class="tech-form" style="margin-top:8px;">
<div class="field"><label>名前（街の名）</label><input name="newusername" placeholder="名前" /></div>
<div class="field" style="margin-top:8px;"><label>パスワード（4文字以上）</label><input name="newpassword" type="text" autocomplete="off" placeholder="パスワード" /></div>
<div style="margin-top:8px;"><button class="btn-primary" style="width:100%;">作成してログイン</button></div>
</form>
<p style="font-size:11px;color:var(--tech-gray);">初期ロールは傭兵です。構成員への変更はボスに連絡してください。</p>
</details>
<button type="button" id="loginClose" class="btn-ghost" style="width:100%;margin-top:12px;">閉じる</button>
<button id="logoutBtn" style="background:none;border:none;text-decoration:underline;font-size:12px;color:var(--tech-gray);margin-top:8px;cursor:pointer;">ログアウト</button>
</div>
</div>
<script src="./supabaseClient.js"></script>
<script src="./app.js"></script>
</body>
</html>
