<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>補填台帳 — ギャング補填管理</title>
<link rel="stylesheet" href="./styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="literary-nav">
<div class="nav-container">
<div class="nav-title">補填台帳 <span class="accent-number">01</span></div>
<div class="nav-menu">
<a href="#/dashboard" data-nav="dashboard">台帳概要</a>
<a href="#/jobs" data-nav="jobs">犯罪枠</a>
<a href="#/pool" data-nav="pool">プール金</a>
<a href="#/members" data-nav="members">名簿</a>
<span id="poolBadge" class="pool-line"></span>
<button id="loginBtn" class="btn-ink">ボス</button>
</div>
</div>
</nav>
<div class="hero">
<div class="hero-label">GANG LEDGER — FIVEM</div>
<h1 class="hero-title">犯罪のあと、金をきれいに。<span>誰が・どこで・いくらを記録する補填台帳</span></h1>
<p class="hero-description">枠を立て、参加を集め、罰金と個人医代を申告し、プール金から補填するまで。現場はログイン不要、補填の印だけボスが押す。</p>
<div id="modeBadge" class="mode-line"></div>
</div>
<main id="app"></main>
<div id="loginModal" class="modal-bg hidden">
<div class="modal-box literary-form">
<h3 style="margin-top:0;">ボス / アンダーボス</h3>
<p style="font-size:0.9rem;color:var(--sub);">補填の印・プール入出金・台帳概要に必要。一般参加は不要。</p>
<input id="loginPass" type="password" placeholder="合言葉" />
<div style="display:flex;gap:0.8rem;margin-top:1rem;">
<button id="loginGo" class="btn-main" style="width:auto;flex:1;">入る</button>
<button id="loginClose" class="btn-sub" style="flex:1;">閉じる</button>
</div>
<button id="logoutBtn" style="background:none;border:none;text-decoration:underline;font-size:0.8rem;color:var(--sub);margin-top:0.8rem;cursor:pointer;">出る（ログアウト）</button>
</div>
</div>
<script src="./supabaseClient.js"></script>
<script src="./app.js"></script>
</body>
</html>
